<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BREST　テ対英単語アプリ</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="backButton" type="button" aria-label="戻る" hidden>‹</button>
        <div class="title-area">
          <p class="eyebrow" id="eyebrow">BREST　テ対英単語アプリ</p>
          <div class="title-row">
            <h1 id="screenTitle">単語を選択</h1>
            <p class="title-alert" id="titleAlert" role="status"></p>
          </div>
        </div>
      </header>

      <section class="screen is-active" id="loginScreen" aria-labelledby="screenTitle">
        <form class="login-form" id="loginForm">
          <label>
            <span>パスワード</span>
            <input id="passwordInput" type="password" autocomplete="current-password" required>
          </label>
          <p class="message" id="loginMessage" role="status"></p>
          <button class="primary-button" type="submit">入室</button>
        </form>
      </section>

      <section class="screen" id="selectScreen" aria-labelledby="screenTitle">
        <fieldset>
          <legend>出題方向</legend>
          <div class="segmented">
            <label>
              <input type="radio" name="direction" value="en-ja" checked>
              <span>英→日</span>
            </label>
            <label>
              <input type="radio" name="direction" value="ja-en">
              <span>日→英</span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>問題数</legend>
          <div class="segmented segmented-three">
            <label>
              <input type="radio" name="quizCount" value="10" checked>
              <span>10問</span>
            </label>
            <label>
              <input type="radio" name="quizCount" value="20">
              <span>20問</span>
            </label>
            <label>
              <input type="radio" name="quizCount" value="all">
              <span>全て</span>
            </label>
          </div>
        </fieldset>

        <div class="selection-bar">
          <div>
            <strong id="selectedCount">0語選択</strong>
            <span id="visibleCount">0語表示</span>
          </div>
          <button class="secondary-button compact-button" id="missListButton" type="button">ミスリスト</button>
        </div>

        <div class="search-wrap">
          <label for="wordSearch">単語検索</label>
          <input id="wordSearch" type="search" placeholder="英単語の先頭スペルで検索">
        </div>

        <div class="action-grid">
          <button class="secondary-button" id="selectVisibleButton" type="button">表示中を選択</button>
          <button class="secondary-button" id="clearSelectionButton" type="button">選択解除</button>
        </div>

        <p class="message" id="selectMessage" role="status"></p>
        <div class="word-list" id="wordList" aria-label="単語リスト"></div>
        <button class="primary-button sticky-action" id="startSelectedButton" type="button">選んだ単語で演習</button>
      </section>

      <section class="screen" id="missScreen" aria-labelledby="screenTitle">
        <div class="selection-bar">
          <div>
            <strong id="missCount">0語</strong>
            <span>ミスした単語</span>
          </div>
          <button class="secondary-button compact-button" id="clearMissButton" type="button">空にする</button>
        </div>
        <p class="message" id="missMessage" role="status"></p>
        <div class="word-list" id="missWordList" aria-label="ミスリスト"></div>
        <button class="primary-button sticky-action" id="startMissButton" type="button">ミスリストだけ練習</button>
      </section>

      <section class="screen quiz-screen" id="quizScreen" aria-labelledby="screenTitle">
        <div class="quiz-meta">
          <span id="quizProgress">1 / 10</span>
        </div>
        <div class="prompt-panel">
          <p id="promptLabel">英単語</p>
          <div id="promptText"></div>
        </div>
        <div class="choice-list" id="choices"></div>
        <p class="answer-feedback" id="answerFeedback" aria-live="polite"></p>
      </section>

      <section class="screen" id="resultScreen" aria-labelledby="screenTitle">
        <div class="result-summary">
          <p class="result-score" id="resultTitle">演習終了</p>
          <p id="resultText"></p>
        </div>
        <div class="missed-wrap">
          <h2>今回ミスした単語</h2>
          <div id="sessionMissList"></div>
        </div>
        <div class="result-actions">
          <button class="secondary-button" id="retryButton" type="button">もう一度</button>
          <button class="primary-button" id="homeButton" type="button">単語選択へ</button>
        </div>
      </section>
    </main>

    <script src="data/vocab.js?v=integrated-20260525"></script>
    <script src="app.js"></script>
  </body>
</html>
